name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config
      - name: macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Use crates.io on CI
        run: rm -f engine/.cargo/config.toml
      - name: Build
        working-directory: engine
        run: cargo build --release
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN=engine/target/release/local-ocr-engine
          if [[ -f "${BIN}.exe" ]]; then BIN="${BIN}.exe"; fi
          OUT="dist/local-ocr-engine-${{ matrix.target }}"
          if [[ "$BIN" == *.exe ]]; then OUT="${OUT}.exe"; fi
          cp "$BIN" "$OUT"
          strip "$OUT" || true
          chmod +x "$OUT" || true
          (cd dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256" || shasum -a 256 "$(basename "$OUT")" > "$(basename "$OUT").sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/local-ocr-engine-*
          generate_release_notes: true
          fail_on_unmatched_files: false
