[package]
name = "local-ocr-engine"
version = "4.1.1"
edition = "2021"
description = "local-ocr skill engine: ocr-rs + PP-OCRv6"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
image = "0.25"
ocr-rs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
